version: '3.8'

# ============================================================
# Prometheus + Grafana + Alertmanager 监控平台
# 支持动态添加/删除监控目标（node-exporter / influxdb / postgresql 等）
# ============================================================

networks:
  monitor-net:
    driver: bridge
    name: monitor-net

volumes:
  prometheus_data: {}
  grafana_data: {}
  alertmanager_data: {}

services:
  # ============================================================
  # 1. Prometheus - 核心时序数据库 + 抓取器
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./prometheus/targets.d:/etc/prometheus/targets.d:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'          # 数据保留 30 天
      - '--storage.tsdb.retention.size=20GB'          # 数据保留大小 20GB
      - '--web.enable-lifecycle'                       # 允许通过 HTTP API 重载配置 (/-/reload)
      - '--web.enable-admin-api'
      - '--web.external-url=http://localhost:9090'
    ports:
      - "9090:9090"
    networks:
      - monitor-net
    extra_hosts:
      - "host.docker.internal:host-gateway"           # 访问宿主机

  # ============================================================
  # 2. Alertmanager - 告警路由与分发
  # ============================================================
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    networks:
      - monitor-net

  # ============================================================
  # 3. Grafana - 可视化面板
  #    - 默认登录: admin / admin123
  #    - 预置数据源: Prometheus (自动)
  #    - 预置 Dashboard: Node Exporter / MySQL / PostgreSQL
  # ============================================================
  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-clock-panel
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboard_files:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - monitor-net
    depends_on:
      - prometheus

  # ============================================================
  # 4. Node Exporter - 宿主机/物理机指标采集（可选）
  #    注意：若监控的是远程物理机，请在物理机上单独部署
  #    node-exporter，而不是在这里启用此服务。
  #    这里提供的是监控宿主机自身的示例。
  # ============================================================
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    # network_mode: host   # 如果要监控宿主机的完整网络指标，取消本行注释并注释掉 networks/ports
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/.+)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - monitor-net
