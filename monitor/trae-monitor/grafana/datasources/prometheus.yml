# ============================================================
# Grafana 数据源配置
#  - 自动配置 Prometheus 为默认数据源
#  - 通过容器服务名 prometheus:9090 访问
# ============================================================

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST
