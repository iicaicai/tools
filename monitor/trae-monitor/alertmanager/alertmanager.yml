# ============================================================
# Alertmanager 配置
#  - 定义全局 SMTP / Webhook 参数
#  - 定义路由规则（根据 severity 分发）
#  - 定义接收者（receiver）
#
# 使用方法:
#   1) 按需修改下面的 email / webhook 配置
#   2) 重启 alertmanager 或 `killall -HUP alertmanager`
# ============================================================

global:
  resolve_timeout: 5m
  # --- 示例：SMTP 邮件告警配置 ---
  # smtp_smarthost: 'smtp.example.com:587'
  # smtp_from: 'alerts@example.com'
  # smtp_auth_username: 'alerts@example.com'
  # smtp_auth_password: 'your_smtp_password'

  # --- 示例：企业微信 / 钉钉 / Slack Webhook ---
  # 请结合对应的 webhook 工具（例如 prometheus-webhook-dingtalk）

route:
  receiver: 'default-receiver'
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  # --- 子路由：严重告警（critical）另发送到运维 ---
  routes:
    - match:
        severity: critical
      receiver: 'ops-team'
      continue: true

receivers:
  - name: 'default-receiver'
    # 留空表示默认仅写入日志（方便测试）
    # 要开启邮件通知，取消下面的注释并正确配置 global.smtp_*
    # email_configs:
    #   - to: 'dev@example.com'
    #     send_resolved: true

  - name: 'ops-team'
    # 示例：使用 Webhook 转发到企业微信 / 钉钉机器人
    # webhook_configs:
    #   - url: 'http://your-webhook-server:8060/dingtalk/ops/send'
    #     send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']
